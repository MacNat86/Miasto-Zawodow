<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Miastotwórcy — gra symulacyjna</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1226;--p:#162040;--p2:#1f2c55;--l:#2d3d73;--t:#f1f5ff;--m:#9fb0d9;--gold:#fbbf24;--g:#22c55e;--b:#3b82f6}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% -10%,#1c2a5e,var(--bg) 55%) fixed;color:var(--t);min-height:100vh;font-weight:500}
h1,h2,h3,.d{font-family:Sora,Manrope,sans-serif;font-weight:700}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;color:#fff;background:var(--b)}
button:hover:not(:disabled){filter:brightness(1.12)}button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{font:inherit;background:var(--bg);color:var(--t);border:2px solid var(--l);border-radius:10px;padding:8px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 22px;background:rgba(22,32,64,.93);border-bottom:2px solid var(--l);position:sticky;top:0;z-index:5}
header h1{font-size:1.25rem}.tm{display:flex;gap:8px;align-items:center}.tm input{width:56px;text-align:center;font-weight:800}
#clk{font:700 1.9rem "Courier New",monospace;color:#38bdf8;min-width:90px;text-align:center}#clk.end{color:#ef4444}
main{padding:18px 22px;max-width:1500px;margin:auto}
.card{background:var(--p);border-radius:18px;padding:18px;margin-bottom:14px}
.setup{max-width:600px;margin:26px auto;display:grid;gap:12px}.setup label{display:grid;gap:4px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.fc{background:var(--p);border:3px solid var(--c,var(--l));border-radius:16px;padding:14px;animation:pop .5s both}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.fc input.nm{width:100%;font:700 1.1rem Sora;margin-bottom:8px}
.jc{border-left:6px solid var(--c);background:var(--p2);border-radius:10px;padding:7px 10px;margin-top:7px}.jc small{display:block;color:var(--m)}
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;min-height:230px;background:var(--p)}
.hero svg{display:block;width:100%;height:230px}.hero .tx{padding:16px 20px;background:var(--p2)}
.hero .tx p{font-size:1.2rem;line-height:1.5}
.sun{transform-origin:690px 70px;animation:pl 3s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.14)}}
.rain line{stroke:#dbeafe;stroke-width:2;animation:fall .9s linear infinite}@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(220px)}}
.pin{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.steps div{padding:7px 14px;border-radius:99px;background:var(--p2);color:var(--m);font-weight:800;font-size:.95rem}.steps .on{background:var(--b);color:#fff}
.city{display:flex;gap:8px;font-size:1.8rem;align-items:center}.city small{font:700 1rem Manrope;color:var(--m)}
.key{background:rgba(251,191,36,.15);border-left:4px solid var(--gold);padding:6px 10px;border-radius:8px;margin-top:8px;font-weight:700}.fc ul{padding-left:20px;margin-top:6px}.big{font-size:1.45rem}#pr{display:none}.qq svg{width:100%;height:auto;display:block}.sheet{max-width:640px;margin:auto}.sl{display:grid;gap:5px;font-weight:700;margin-bottom:12px}.sl textarea{width:100%;font-size:1rem}.pgb{margin:10px 0;color:var(--gold);font-weight:800}.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:20px;font-size:1.25rem;line-height:1.5}.ov h3{margin-top:14px;color:var(--gold)}.ov button{margin-top:20px;width:100%;padding:14px}.task{font-size:1.3rem;margin:4px 0 8px}
.rub{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rub>div{background:var(--p2);border-radius:12px;padding:10px}.rub b{display:block;margin-bottom:4px}.rub p{font-size:.9rem;color:var(--m);margin-top:3px}.rub p i{font-style:normal;color:var(--gold);font-weight:800}
.sc{display:grid;grid-template-columns:1fr repeat(3,auto);gap:8px 10px;align-items:center}.sc .h{color:var(--m);font-size:.85rem;text-align:center}
.pt{background:var(--l);padding:8px 14px}.pt.on{background:var(--g)}
.nav{display:flex;justify-content:space-between;margin-top:14px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:center;border-bottom:1px solid var(--l)}td:first-child,th:first-child{text-align:left}
dialog{border:3px solid var(--l);border-radius:18px;background:var(--p);color:var(--t);padding:22px;width:min(520px,92vw)}dialog::backdrop{background:rgba(5,9,25,.8)}
@media(max-width:800px){.rub{grid-template-columns:1fr}}
@media print{header,main,dialog,footer{display:none!important}body{background:#fff;color:#000}#pr{display:block}.pg{page-break-after:always;color:#000;font-size:10.5pt;line-height:1.35}.pg:last-child{page-break-after:auto}.pg h2{font-size:15pt}.pg h4{margin:9px 0 3px}.pg .key{background:#fff7d6;border-left:4px solid #b8860b}.ln{border-bottom:1px solid #777;height:21px}.bx{border:1px solid #777;height:120px}.pg table{width:100%;border-collapse:collapse}.pg td{border:1px solid #777;padding:5px;height:30px;text-align:left}}
.idr{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;background:var(--p2);border-radius:10px;padding:8px;margin-top:8px}
.sg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.sg b{font-size:.78rem;color:var(--m);margin-right:2px}
.mini{background:var(--l);padding:5px 10px;border-radius:8px;font-size:.9rem}.mini.on{background:var(--g)}
.bar{height:22px;background:var(--p2);border-radius:8px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--g)}
.brow{display:flex;gap:10px;align-items:center;margin:6px 0}.brow span{min-width:200px}
.idea{background:var(--p);border-radius:12px;padding:10px;margin-bottom:10px}.idea.st{outline:3px solid var(--gold)}
.idea textarea,.idea input{width:100%;margin-top:6px}
#rem{font-weight:800;color:var(--gold)}
footer{padding:18px 24px;text-align:center;color:var(--m);font-size:.82rem;line-height:1.5}
/* Ekran powitalny Miastotwórcy — lekki, pełnoekranowy, bez białego prostokąta pod logo gry */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:auto;overscroll-behavior:contain;padding:clamp(12px,2.5vh,28px) clamp(14px,3vw,48px);background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.96) 0%,rgba(255,255,255,.7) 27%,rgba(255,255,255,0) 61%),radial-gradient(circle at 86% 16%,rgba(87,201,255,.42),transparent 25%),radial-gradient(circle at 8% 18%,rgba(65,143,236,.28),transparent 27%),linear-gradient(135deg,#dff3ff 0%,#f7fbff 47%,#e0f2ff 100%);color:#0b2852;isolation:isolate;opacity:1;transition:opacity .42s ease}
#splash:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(36,105,174,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(36,105,174,.07) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 82%)}
#splash:after{content:"";position:absolute;left:0;right:0;bottom:0;height:17vh;min-height:70px;z-index:-1;pointer-events:none;opacity:.36;background:linear-gradient(0deg,rgba(46,130,196,.18),transparent 82%);clip-path:polygon(0 53%,4% 53%,4% 34%,8% 34%,8% 64%,12% 64%,12% 20%,17% 20%,17% 53%,21% 53%,21% 39%,26% 39%,26% 72%,31% 72%,31% 29%,36% 29%,36% 56%,41% 56%,41% 43%,46% 43%,46% 69%,51% 69%,51% 27%,56% 27%,56% 57%,61% 57%,61% 40%,66% 40%,66% 71%,71% 71%,71% 23%,76% 23%,76% 55%,81% 55%,81% 35%,86% 35%,86% 65%,91% 65%,91% 18%,96% 18%,96% 56%,100% 56%,100% 100%,0 100%)}
#splash .sp-glow{position:absolute;width:min(75vw,900px);aspect-ratio:1;border-radius:50%;left:50%;top:45%;transform:translate(-50%,-50%);z-index:-1;background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(255,255,255,.48) 38%,transparent 70%);pointer-events:none}
#splash .sp-topbar{position:absolute;top:clamp(12px,2.6vh,30px);left:clamp(12px,3vw,42px);right:clamp(12px,3vw,42px);display:flex;align-items:flex-start;justify-content:space-between;gap:14px;z-index:3;pointer-events:none}
#splash .sp-topbar>*{pointer-events:auto}
#splash .sp-logo{display:block;width:clamp(76px,9vw,116px);height:auto;max-height:94px;object-fit:contain;border-radius:11px;box-shadow:0 7px 22px rgba(9,32,68,.14);border:1px solid rgba(255,255,255,.45)}
#splash .sp-shell{width:min(100%,1000px);position:relative;text-align:center;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(58px,8vh,88px) 0 5px;gap:0}
#splash .sp-kicker{display:inline-flex;align-items:center;gap:9px;margin:0 auto clamp(2px,.7vh,8px);padding:7px 13px;border:1px solid rgba(67,139,201,.3);border-radius:999px;background:rgba(255,255,255,.78);box-shadow:0 5px 18px rgba(16,63,113,.07);color:#2469a4;font-size:.72rem;font-weight:900;letter-spacing:.17em;text-transform:uppercase}
#splash .sp-dot{width:7px;height:7px;border-radius:50%;background:#17a5e8;box-shadow:0 0 13px rgba(23,165,232,.68)}
#splash .sp-game-logo{display:block;width:min(84vw,760px);height:auto;max-height:53vh;object-fit:contain;margin:0 auto;filter:drop-shadow(0 14px 24px rgba(13,49,86,.14))}
#splash .sp-tagline{position:relative;margin:clamp(-4px,-.4vh,0) auto 0;padding:7px 17px;border:1px solid rgba(72,128,176,.16);border-radius:999px;background:rgba(255,255,255,.67);color:#0b2d60;font-size:clamp(1rem,2.1vw,1.4rem);font-weight:900;letter-spacing:-.025em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#splash .sp-subtitle{margin:clamp(7px,1.4vh,13px) auto 0;max-width:620px;color:#365a7e;font-size:clamp(.9rem,1.6vw,1.08rem);font-weight:700;line-height:1.5;text-wrap:balance}
#splash .sp-start{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-width:min(100%,260px);margin-top:clamp(12px,2.3vh,22px);padding:15px 25px;border:1px solid rgba(255,255,255,.7);border-radius:15px;background:linear-gradient(105deg,#ffdf54,#ffb72b);box-shadow:0 12px 28px rgba(217,144,20,.22),inset 0 1px rgba(255,255,255,.7);color:#0b2852;font:900 1rem Manrope,"Segoe UI",sans-serif;letter-spacing:.01em;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
#splash .sp-start:hover{transform:translateY(-2px);filter:brightness(1.035);box-shadow:0 16px 34px rgba(217,144,20,.29),inset 0 1px rgba(255,255,255,.7)}
#splash .sp-start:focus-visible,#splash .fs-toggle:focus-visible{outline:3px solid #138bd0;outline-offset:4px}
#splash .sp-arrow{font-size:1.35rem;line-height:1}
#splash .sp-features{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px 11px;margin-top:clamp(14px,2.8vh,26px);color:#244b73;font-size:.8rem;font-weight:800}
#splash .sp-features span{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid rgba(81,138,187,.18);border-radius:999px;background:rgba(255,255,255,.53)}
#splash .sp-features i{width:7px;height:7px;display:inline-block;border-radius:50%;background:#159fe2;box-shadow:0 0 0 3px rgba(21,159,226,.11)}
.fs-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border-radius:11px;background:rgba(255,255,255,.82);color:#174777;border:1px solid rgba(63,123,177,.3);font-size:.84rem;font-weight:900;white-space:nowrap;box-shadow:0 5px 18px rgba(12,49,86,.07)}
.fs-toggle .fs-icon{font-size:1.1rem;line-height:1}
#splash .fs-toggle:hover{background:#fff;filter:none;transform:translateY(-1px)}
header .fs-toggle{background:#2b3e70;color:#f1f5ff;border:1px solid #5167a0;box-shadow:none}
header .fs-toggle:hover:not(:disabled){background:#3a4f86;filter:none}
.fs-status{position:fixed;left:50%;bottom:18px;z-index:300;max-width:min(92vw,560px);padding:11px 16px;border-radius:12px;background:#102751;color:#fff;font-size:.9rem;font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.23);opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .2s ease,transform .2s ease}
.fs-status.show{opacity:1;transform:translate(-50%,0)}
#splash.closing{opacity:0;pointer-events:none}
@media(max-width:700px){#splash{padding:12px 12px 20px}#splash .sp-topbar{top:10px;left:12px;right:12px}#splash .sp-logo{width:78px;max-height:66px;border-radius:8px}#splash .fs-toggle{padding:8px 10px;font-size:.78rem}#splash .sp-shell{padding-top:clamp(66px,10vh,82px)}#splash .sp-game-logo{width:min(91vw,620px);max-height:46vh}#splash .sp-tagline{font-size:clamp(.9rem,3.8vw,1.16rem);padding:6px 12px}#splash .sp-subtitle{max-width:500px;font-size:.91rem}#splash .sp-features{gap:6px;margin-top:14px;font-size:.72rem}#splash .sp-features span{padding:7px 9px}}
@media(max-height:700px) and (min-width:701px){#splash{padding-top:8px;padding-bottom:8px}#splash .sp-shell{padding-top:62px}#splash .sp-logo{width:84px;max-height:65px}#splash .sp-game-logo{max-height:43vh;width:min(72vw,610px)}#splash .sp-tagline{font-size:1.02rem;padding:5px 13px}#splash .sp-subtitle{margin-top:5px;font-size:.88rem}#splash .sp-start{margin-top:9px;padding:11px 22px}#splash .sp-features{margin-top:10px;font-size:.73rem}}
@media(max-height:560px){#splash .sp-shell{padding-top:54px}#splash .sp-game-logo{max-height:36vh;width:min(60vw,460px)}#splash .sp-kicker{font-size:.63rem;padding:5px 10px}#splash .sp-tagline{font-size:.88rem;margin-top:-3px}#splash .sp-subtitle{font-size:.8rem;margin-top:4px}#splash .sp-start{padding:9px 18px;margin-top:7px}#splash .sp-features{margin-top:7px}#splash .sp-features span{padding:5px 8px}}
@media(max-width:440px){#splash .sp-features span{font-size:.68rem;padding:6px 8px}#splash .sp-features{gap:5px}#splash .sp-subtitle{max-width:340px}}
@media(prefers-reduced-motion:reduce){#splash,#splash .sp-start,#splash .fs-toggle,.fs-status{transition:none!important}}


/* Ekran powitalny odwzorowujący dostarczoną grafikę */
#splash{padding:0;border-radius:0;background:#0b2852;display:flex;align-items:center;justify-content:center;overflow:hidden}
#splash:before,#splash:after{display:none}
#splash .sp-canvas{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;max-height:100vh;flex:none;line-height:0}
#splash .sp-reference-art{display:block;width:100%;height:100%;object-fit:contain}
#splash .sp-hotspot-start,#splash .sp-hotspot-fullscreen{position:absolute;display:block;padding:0;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;min-width:0;min-height:0;line-height:normal;opacity:0}
#splash .sp-hotspot-start{left:39.2%;top:76.4%;width:22%;height:8.3%}
#splash .sp-hotspot-fullscreen{right:1.1%;bottom:1.2%;width:4.5%;height:5.5%}
#splash .sp-hotspot-start:hover,#splash .sp-hotspot-fullscreen:hover{filter:none;transform:none;box-shadow:none}
#splash .sp-hotspot-start:focus-visible,#splash .sp-hotspot-fullscreen:focus-visible{opacity:.16;outline:3px solid #138bd0;outline-offset:2px;background:#fff}
@media(max-aspect-ratio:3/2){#splash .sp-canvas{width:100vw;height:auto;max-height:none}}
@media(prefers-reduced-motion:reduce){#splash{transition:none!important}}

</style></head><body>

const ctl=t=>`<div class="card"><h3>Scenariusz tury</h3><p style="color:var(--m);margin:4px 0 8px">Wylosowany zgodnie z zasadami. Możesz wylosować ponownie lub wybrać inny.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="redraw()" style="background:#64748b">🎲 Wylosuj ponownie</button><select onchange="setsc(+this.value)">${SC.map((s,i)=>`<option value="${i}" ${i==S.seq[t]?"selected":""}>${s.n} (${s.k})</option>`).join("")}</select></div></div>`;
const xs=D=>`<details class="card"><summary style="cursor:pointer;font-weight:800">Przykłady nierealnych pomysłów (dla prowadzącego)</summary><ul style="padding-left:22px;line-height:1.7;margin-top:8px">${D.x.map(x=>`<li>„${x[0]}”. Pytanie: ${x[1]}</li>`).join("")}</ul></details>`;
const rol=(f,t)=>{const F=S.firms[f],n=F.m.length;return{n:F.ord[(2*t)%n],p:F.ord[(2*t+1)%n]}};
const sc=t=>S.sc[t]||(S.sc[t]=S.firms.map(()=>({i:[[0,0,0],[0,0,0],[0,0,0]],h:0})));
const ip=x=>x[0]+x[1]+x[2],fi=(t,f)=>sc(t)[f].i.reduce((a,x)=>a+ip(x),0),ft=(t,f)=>fi(t,f)+sc(t)[f].h;
const tot=f=>Object.keys(S.done).filter(t=>S.done[t]).reduce((a,t)=>a+ft(+t,f),0);
const cov=t=>S.firms.filter((_,f)=>fi(t,f)>=6).length,hlp=t=>S.firms.reduce((a,_,f)=>a+sc(t)[f].h,0);
const left=()=>S.t0?Math.max(0,S.total-Math.round((Date.now()-S.t0)/60000)):S.total;
function tickRem(){$("#rem").textContent=S&&S.t0&&S.screen!="final"?`Pozostało: ${left()} min`:""}setInterval(tickRem,20000);

function setup(){$("#app").innerHTML=`<div class="card setup"><h2>Nowa gra</h2>
<label>Długość warsztatu<select id="v"><option value="135">3 godziny lekcyjne (135 min)</option><option value="90">2 godziny lekcyjne (90 min)</option></select></label>
<label>Liczba uczniów (6–30)<input id="n" type="number" value="24" min="6" max="30"></label>
<label>Liczba firm (puste = automatycznie, 3–6)<input id="k" type="number" min="3" max="6"></label>
<label>Imiona uczniów (opcjonalnie, po jednym w wierszu)<textarea id="names" rows="4"></textarea></label>
<button onclick="draw()">🎲 Losuj firmy i zawody</button></div>`}
function draw(){let names=$("#names").value.split("\n").map(s=>s.trim()).filter(Boolean);const n=names.length||parseInt($("#n").value);
 if(!n||n<6||n>30){alert("Wpisz liczbę uczniów od 6 do 30.");return}
 if(!names.length)names=Array.from({length:n},(_,i)=>"Uczeń "+(i+1));
 let k=parseInt($("#k").value)||Math.round(n/4.5);k=Math.max(3,Math.min(6,k,Math.floor(n/3)));
 build(names,k,+$("#v").value)}
function build(names,k,total,fn){const pool=AR.map((_,a)=>shuf(JB[a])),firms=Array.from({length:k},(_,f)=>({name:"Firma "+String.fromCharCode(65+f),m:[]}));
 shuf(names).forEach((s,i)=>{const f=i%k,a=(f+Math.floor(i/k))%5;if(!pool[a].length)pool[a]=shuf(JB[a]);const[j,o]=pool[a].pop();firms[f].m.push({n:s,a,j,o})});
 firms.forEach(f=>f.ord=shuf(f.m.map((_,i)=>i)));
 S={total,t0:0,firms,perm:shuf([0,1,2,3,4,5]),t:0,st:0,rev:{},sc:{},done:{},screen:"roster",seq:[]};if(fn)S.firms.forEach((f,i)=>{if(fn[i])f.name=fn[i]});S.seq[0]=pickSc(0);save();render()}
function reshuf(){const names=S.firms.flatMap(f=>f.m.map(m=>m.n));build(names,K(),S.total,S.firms.map(f=>f.name))}
function backTurn(){S.screen="turn";S.st=4;save();render();tickRem();scrollTo(0,0)}
function roster(){$("#app").innerHTML=`<h2 class="big" style="margin-bottom:12px">Firmy i zawody</h2><div class="grid">${S.firms.map((f,i)=>`<div class="fc"><input class="nm" value="${esc(f.name)}" onchange="S.firms[${i}].name=this.value;save()" aria-label="Nazwa firmy">${f.m.map(m=>`<div class="jc" style="--c:${AR[m.a][2]}">${AR[m.a][0]} <b>${esc(m.n)}</b> – ${m.j}<small>Pomagasz, gdy: ${m.o}</small></div>`).join("")}</div>`).join("")}</div>
<div class="nav"><div style="display:flex;gap:8px;flex-wrap:wrap"><button style="background:#64748b" onclick="reshuf()">🎲 Losuj ponownie (ci sami uczniowie)</button><button style="background:#475569" onclick="setup()">⚙️ Zmień ustawienia</button></div><button onclick="S.screen='turn';S.t0=Date.now();stg();save();render();tickRem()">Start warsztatu: tura 1 ▶</button></div>`}
function stg(){const m=PRE[S.st];if(m)$("#min").value=m}
function go(d){if(S.st==4&&d>0){S.done[S.t]=true;if(d==2||S.t==MAXT-1)S.screen="final";else{S.t++;S.st=0;S.seq[S.t]=pickSc(S.t)}}else S.st+=d;if(S.st==4)S.done[S.t]=true;else S.done[S.t]=false;stg();save();render();scrollTo(0,0);tickRem()}
function setv(f,i,c,v){sc(S.t)[f].i[i][c]=v;save();render()}
function seth(f,d){const x=sc(S.t)[f];x.h=Math.max(0,x.h+d);save();render()}
const MX=[3,2,2],LB=["Wymogi","Zawody","Pomoc"];
function tcard(f){const F=S.firms[f],t=S.t,r=rol(f,t),e=ENM(f,t);return`<div class="fc"><h3>${esc(F.name)} · ${e}</h3><p style="color:var(--m);margin-top:4px">${EDS(f,t)}</p><p style="margin-top:6px">🤝 Rzecznik: <b>${nm(f,r.n)}</b></p><p>🎤 Prezenter: <b>${nm(f,r.p)}</b></p></div>`}
function turn(){const t=S.t,D=SC[S.seq[t]],k=K();
 let h=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px"><h2 class="big">Tura ${t+1}: ${D.n} <small style="color:var(--m);font-weight:500">(${D.k})</small></h2></div><div class="steps">${STG.map((s,i)=>`<div class="${i==S.st?"on":""}">${s}</div>`).join("")}</div>`;
 if(S.st==0){h+=`<div class="hero">${scene(S.seq[t])}<div class="tx"><p>${D.p}</p><p style="color:var(--gold);margin-top:8px"><b>Zadanie:</b> ${D.q}</p></div></div>${S.rev[t]?"":ctl(t)}<div class="card"><h3>Ramy realności</h3><ul style="padding-left:22px;line-height:1.7">${D.rm.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 <div class="card"><h3>Elementy miasta i role</h3>${S.rev[t]?`<div class="grid" style="margin-top:10px">${S.firms.map((f,i)=>tcard(i)).join("")}</div>`:`<button style="margin-top:10px" onclick="S.rev[S.t]=true;save();render()">🎲 Losuj elementy i role</button>`}</div>`}
 if(S.st==1)h+=`<div class="card"><p style="font-size:1.15rem;line-height:1.6">Wymyślcie <b>jak najwięcej realnych pomysłów</b> dla swojego elementu miasta. <b>Rzecznik</b> może podchodzić do rzeczników innych firm i pytać: <i>„Czy macie specjalistę, który mógłby nam pomóc?”</i>. Specjalista potwierdza, co faktycznie by zrobił.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button onclick="qrs()">📱 Arkusze na telefon (QR)</button><button onclick="prn()" style="background:#64748b">🖨️ Drukuj arkusze</button></div></div><div class="grid">${S.firms.map((f,i)=>tcard(i)).join("")}</div>`;
 if(S.st==2)h+=`<div class="card"><h3>Wybierzcie 3 najlepsze pomysły</h3><p style="font-size:1.15rem;line-height:1.6;margin-top:6px">Oceniamy tylko trzy pomysły. Przygotujcie dla każdego jedno zdanie: <b>co robimy, jak zdążymy w podanym czasie i czyja wiedza nam pomaga</b>. Prezenter przedstawi je w minutę.</p></div><div class="grid">${S.firms.map((f,i)=>tcard(i)).join("")}</div>`;
 if(S.st==3){h+=`<div class="card"><div class="rub" style="grid-template-columns:repeat(3,1fr)"><div><b>Wymogi (0–3)</b>${D.w.map(x=>`<p><i>+1</i> ${x}</p>`).join("")}</div><div><b>Zawody w firmie (0–2)</b><p><i>+1</i> za każdy zawód z firmy, bez którego pomysł byłby słabszy</p></div><div><b>Pomoc z innej firmy (0–2)</b><p><i>+1</i> za każdego specjalistę, który potwierdził, że tak by pomógł. Firma pomagająca dostaje <i>+1</i> za pomoc.</p></div></div></div>${xs(D)}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(400px,1fr))">${S.firms.map((F,f)=>{const x=sc(t)[f],e=ENM(f,t);return`<div class="fc"><h3>${esc(F.name)} · ${e}</h3><p style="color:var(--m)">🎤 ${nm(f,rol(f,t).p)}</p>${x.i.map((id,i)=>`<div class="idr"><b>Pomysł ${i+1}<br><span style="color:var(--gold)">${ip(id)} pkt</span></b><div>${[0,1,2].map(c=>`<div class="sg"><b>${LB[c]}</b>${Array.from({length:MX[c]+1},(_,v)=>`<button class="mini ${id[c]===v?"on":""}" onclick="setv(${f},${i},${c},${v})">${v}</button>`).join("")}</div>`).join("")}</div></div>`).join("")}<div class="sg" style="margin-top:10px"><b>Pomogliśmy innym</b><button class="mini" onclick="seth(${f},-1)">−</button><b style="font-size:1.1rem;color:var(--t)">${x.h}</b><button class="mini" onclick="seth(${f},1)">+</button></div><p style="margin-top:8px;font-weight:800">Razem: ${ft(t,f)} pkt</p></div>`}).join("")}</div>`}
 if(S.st==4){const c=cov(t),L=left(),more=t<MAXT-1&&L>=NEED+SUM;
 h+=`<div class="card"><h3 style="margin-bottom:8px">Wyniki tury</h3><table><tr><th>Firma</th><th>Element</th><th>Pomysły</th><th>Pomoc innym</th><th>Razem</th></tr>${S.firms.map((F,f)=>`<tr><td>${esc(F.name)}</td><td>${ENM(f,t)}</td><td>${fi(t,f)}</td><td>${sc(t)[f].h}</td><td><b>${ft(t,f)}</b></td></tr>`).join("")}</table><p style="margin-top:10px">Elementy miasta z dobrym planem: <b>${c} z ${K()}</b> · Potwierdzonych pomocy między firmami: <b>${hlp(t)}</b></p></div>
 <div class="card"><h3>Omówienie tury</h3><ul style="padding-left:22px;line-height:1.8"><li>Który pomysł był najbardziej realny i dlaczego?</li><li>Kiedy pomoc specjalisty naprawdę zmieniła pomysł?</li><li>Co utrudniało i co ułatwiało pracę w zespole?</li></ul><p style="margin:10px 0" class="key">${t==MAXT-1?"To była ostatnia tura. Przejdź do podsumowania.":S.t0?`Zostało ok. ${L} min. Kolejna tura potrzebuje ok. ${NEED} min, a podsumowanie ok. ${SUM} min. ${more?"Możesz zacząć kolejną turę.":"Zalecane: przejdź do podsumowania lub dłużej omów tę turę."}`:""}</p></div>`}
 h+=`<div class="nav"><button style="background:#64748b" onclick="go(-1)" ${S.st==0?"disabled":""}>◀ Wstecz</button>${S.st==4?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button style="background:#64748b" onclick="go(2)">Podsumowanie</button>${t<MAXT-1?`<button onclick="go(1)">Następna tura ▶</button>`:""}</div>`:`<button onclick="go(1)" ${S.st==0&&!S.rev[t]?"disabled":""}>Dalej ▶</button>`}</div>`;
 $("#app").innerHTML=h}
function rank(){const r=S.firms.map((f,i)=>({n:esc(f.name),p:tot(i)})).sort((a,b)=>b.p-a.p);return`<table><tr><th>#</th><th>Firma</th><th>Punkty</th></tr>${r.map((x,j)=>`<tr><td>${j+1}</td><td>${j==0?"🏆 ":""}${x.n}</td><td><b>${x.p}</b></td></tr>`).join("")}</table>`}
function final(){const ts=Object.keys(S.done).filter(t=>S.done[t]).map(Number),k=K();
 $("#app").innerHTML=`<h2 class="big">Podsumowanie gry</h2><div class="card"><h3 style="margin-bottom:8px">🏆 Ranking firm</h3>${rank()}</div>
 <div class="card"><h3 style="margin-bottom:6px">Jak nasza współpraca poprawiła miasto (elementy z dobrym planem)</h3><p style="color:var(--m);margin-bottom:8px">Rywalizowaliśmy między sobą, ale we wspólnym celu rozwoju naszego miasta. Scenariusze są różne, więc słupków nie porównujemy ze sobą.</p>${ts.map(t=>`<div class="brow"><span>${SC[S.seq[t]].n}</span><div class="bar"><i style="width:${Math.round(100*cov(t)/k)}%"></i></div><b>${cov(t)} z ${k} elementów</b><small style="color:var(--m)">pomoc: ${hlp(t)}</small></div>`).join("")}</div>
 <div class="nav" style="margin:0 0 14px"><button style="background:#64748b" onclick="backTurn()">◀ Wróć do omówienia tury</button></div><div class="card"><h3>Pytania do rozmowy</h3><ol style="padding-left:22px;line-height:1.8"><li>Jak pracowało się rzecznikom i prezenterom?</li><li>Co było łatwe, a co trudne w pracy zespołu?</li><li>Czy udawało się współpracować z rzecznikami innych firm?</li><li>Który zawód okazał się najbardziej potrzebny i dlaczego?</li><li>Czego dowiedzieliście się o zawodach, których wcześniej nie znaliście?</li></ol></div>`}
function render(){if(!S)return setup();({roster,turn,final})[S.screen]()}
function lnk(f){const t=S.t,r=rol(f,t),F=S.firms[f];return location.origin+location.pathname+"#a="+encodeURIComponent([S.seq[t],el(f,t),cl(F.name),r.n,r.p,...F.m.map(m=>cl(m.n)+"."+m.a+"."+JB[m.a].findIndex(x=>x[0]==m.j))].join("~"))}
function qrs(){const d=$("#dlg");d.style.width="min(1100px,96vw)";
 d.innerHTML=`<h2 style="margin-bottom:6px">📱 Arkusze elektroniczne</h2><p style="color:var(--m);margin-bottom:12px">Jeden telefon na firmę. Arkusz zapisuje się w telefonie i można go pokazać nauczycielowi.</p>${location.protocol=="file:"?'<p class="key">Aplikacja jest otwarta z pliku. Kody zadziałają dopiero po wgraniu strony na GitHub Pages.</p>':""}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${S.firms.map((f,i)=>{let g="";try{const q=qrcode(0,"L");q.addData(lnk(i));q.make();g=q.createSvgTag(4,2)}catch(e){g="<p style='color:#000'>Brak biblioteki QR (sprawdź internet)</p>"}return`<div class="fc" style="text-align:center"><b>${esc(f.name)}</b><div class="qq" style="background:#fff;border-radius:10px;padding:4px;margin:8px 0">${g}</div><small>${ENM(i,S.t)}</small></div>`}).join("")}</div><button style="margin:14px auto 0;display:block" onclick="$('#dlg').close()">Zamknij</button>`;d.showModal()}
function prn(){const t=S.t,D=SC[S.seq[t]];$("#pr").innerHTML=S.firms.map((f,i)=>{const e=ENM(i,t),r=rol(i,t);return`<div class="pg"><h2>Miastotwórcy · Tura ${t+1}: ${D.n}</h2><p><b>Firma:</b> ${esc(f.name)} &nbsp; <b>Element:</b> ${e} &nbsp; <b>Rzecznik:</b> ${nm(i,r.n)} &nbsp; <b>Prezenter:</b> ${nm(i,r.p)}</p><p><b>Zadanie:</b> ${D.q}</p><p><b>Ramy:</b> ${D.rm.join(" ")}</p><table><tr><td style="width:50%"><b>Pomysł i jak go wdrożyć w podanym czasie</b></td><td><b>Zawody z naszej firmy</b></td><td><b>Specjalista z innej firmy</b></td><td style="width:8%"><b>★ top 3</b></td></tr>${"<tr><td style='height:15mm'></td><td></td><td></td><td></td></tr>".repeat(8)}</table></div>`}).join("");print()}

 const d=decodeURIComponent(location.hash.slice(3)).split("~"),D=SC[+d[0]],e=D&&D.el[+d[1]];
 if(!D||!e){$("#app").innerHTML="<p class='card'>Nieprawidłowy link do arkusza.</p>";return}
 const key="mzs2"+location.hash,fn=esc(d[2]),M=d.slice(5).map(x=>{const[n,a,j]=x.split(".");return{n:esc(n),j:(JB[+a]||[])[+j]?JB[+a][+j][0]:""}});
 let V={ideas:Array.from({length:4},()=>({p:"",z:"",s:"",st:0}))};try{V=JSON.parse(localStorage.getItem(key))||V}catch(x){}

 const cn=()=>$("#cn").textContent=`Wybrane do oceny: ${ns()} z 3`;cn();

function fullscreenActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function updateFullscreenButtons(){const active=fullscreenActive();document.querySelectorAll('.fs-toggle').forEach(btn=>{const label=btn.querySelector('.fs-label');if(label)label.textContent=active?'Wyjdź z pełnego ekranu':'Pełny ekran';btn.setAttribute('aria-pressed',String(active));btn.title=active?'Wyjdź z pełnego ekranu':'Włącz pełny ekran';});}
let fsStatusTimer=null;
function showFullscreenStatus(message){const el=document.getElementById('fsStatus');if(!el)return;el.textContent=message;el.classList.add('show');if(fsStatusTimer)clearTimeout(fsStatusTimer);fsStatusTimer=setTimeout(()=>el.classList.remove('show'),3800);}
function toggleFullscreen(){if(fullscreenActive()){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit){const result=exit.call(document);if(result&&typeof result.catch==='function')result.catch(()=>showFullscreenStatus('Nie udało się wyłączyć trybu pełnoekranowego.'));}return;}const root=document.documentElement;const request=root.requestFullscreen||root.webkitRequestFullscreen;if(!request){showFullscreenStatus('Ta przeglądarka nie obsługuje trybu pełnoekranowego.');return;}try{const result=request.call(root);if(result&&typeof result.catch==='function')result.catch(()=>showFullscreenStatus('Pełny ekran został zablokowany przez przeglądarkę. Spróbuj ponownie przyciskiem.'));}catch(e){showFullscreenStatus('Pełny ekran został zablokowany przez przeglądarkę.');}}
document.addEventListener('fullscreenchange',updateFullscreenButtons);document.addEventListener('webkitfullscreenchange',updateFullscreenButtons);
function startApp(){const splash=$("#splash");if(!splash)return;splash.classList.add("closing");setTimeout(()=>splash.remove(),430)}
if(location.hash.startsWith("#a=")){const splash=$("#splash");if(splash)splash.remove();sheetMode()}else{render();tickRem()}

</script></body></html>
