<title>Miasto Zawodów</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1226;--p:#162040;--p2:#1f2c55;--l:#2d3d73;--t:#f1f5ff;--m:#9fb0d9;--gold:#fbbf24;--g:#22c55e;--b:#3b82f6}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% -10%,#1c2a5e,var(--bg) 55%) fixed;color:var(--t);min-height:100vh;font-weight:500}
h1,h2,h3,.d{font-family:Sora,Manrope,sans-serif;font-weight:700}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;color:#fff;background:var(--b)}
button:hover:not(:disabled){filter:brightness(1.12)}button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{font:inherit;background:var(--bg);color:var(--t);border:2px solid var(--l);border-radius:10px;padding:8px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 22px;background:rgba(22,32,64,.93);border-bottom:2px solid var(--l);position:sticky;top:0;z-index:5}
header h1{font-size:1.25rem}.tm{display:flex;gap:8px;align-items:center}.tm input{width:56px;text-align:center;font-weight:800}
#clk{font:700 1.9rem "Courier New",monospace;color:#38bdf8;min-width:90px;text-align:center}#clk.end{color:#ef4444}
main{padding:18px 22px;max-width:1500px;margin:auto}
.card{background:var(--p);border-radius:18px;padding:18px;margin-bottom:14px}
.setup{max-width:600px;margin:26px auto;display:grid;gap:12px}.setup label{display:grid;gap:4px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.fc{background:var(--p);border:3px solid var(--c,var(--l));border-radius:16px;padding:14px;animation:pop .5s both}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.fc input.nm{width:100%;font:700 1.1rem Sora;margin-bottom:8px}
.jc{border-left:6px solid var(--c);background:var(--p2);border-radius:10px;padding:7px 10px;margin-top:7px}.jc small{display:block;color:var(--m)}
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;min-height:230px;background:var(--p)}
.hero svg{display:block;width:100%;height:230px}.hero .tx{padding:16px 20px;background:var(--p2)}
.hero .tx p{font-size:1.2rem;line-height:1.5}
.sun{transform-origin:690px 70px;animation:pl 3s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.14)}}
.rain line{stroke:#dbeafe;stroke-width:2;animation:fall .9s linear infinite}@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(220px)}}
.pin{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.steps div{padding:7px 14px;border-radius:99px;background:var(--p2);color:var(--m);font-weight:800;font-size:.95rem}.steps .on{background:var(--b);color:#fff}
.city{display:flex;gap:8px;font-size:1.8rem;align-items:center}.city small{font:700 1rem Manrope;color:var(--m)}
.key{background:rgba(251,191,36,.15);border-left:4px solid var(--gold);padding:6px 10px;border-radius:8px;margin-top:8px;font-weight:700}.fc ul{padding-left:20px;margin-top:6px}.big{font-size:1.45rem}#pr{display:none}.qq svg{width:100%;height:auto;display:block}.sheet{max-width:640px;margin:auto}.sl{display:grid;gap:5px;font-weight:700;margin-bottom:12px}.sl textarea{width:100%;font-size:1rem}.pgb{margin:10px 0;color:var(--gold);font-weight:800}.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:20px;font-size:1.25rem;line-height:1.5}.ov h3{margin-top:14px;color:var(--gold)}.ov button{margin-top:20px;width:100%;padding:14px}.task{font-size:1.3rem;margin:4px 0 8px}
.rub{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rub>div{background:var(--p2);border-radius:12px;padding:10px}.rub b{display:block;margin-bottom:4px}.rub p{font-size:.9rem;color:var(--m);margin-top:3px}.rub p i{font-style:normal;color:var(--gold);font-weight:800}
.sc{display:grid;grid-template-columns:1fr repeat(3,auto);gap:8px 10px;align-items:center}.sc .h{color:var(--m);font-size:.85rem;text-align:center}
.pt{background:var(--l);padding:8px 14px}.pt.on{background:var(--g)}
.nav{display:flex;justify-content:space-between;margin-top:14px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:center;border-bottom:1px solid var(--l)}td:first-child,th:first-child{text-align:left}
dialog{border:3px solid var(--l);border-radius:18px;background:var(--p);color:var(--t);padding:22px;width:min(520px,92vw)}dialog::backdrop{background:rgba(5,9,25,.8)}
@media(max-width:800px){.rub{grid-template-columns:1fr}}
@media print{header,main,dialog,footer{display:none!important}body{background:#fff;color:#000}#pr{display:block}.pg{page-break-after:always;color:#000;font-size:10.5pt;line-height:1.35}.pg:last-child{page-break-after:auto}.pg h2{font-size:15pt}.pg h4{margin:9px 0 3px}.pg .key{background:#fff7d6;border-left:4px solid #b8860b}.ln{border-bottom:1px solid #777;height:21px}.bx{border:1px solid #777;height:120px}.pg table{width:100%;border-collapse:collapse}.pg td{border:1px solid #777;padding:5px;height:30px;text-align:left}}
.idr{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;background:var(--p2);border-radius:10px;padding:8px;margin-top:8px}
.sg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.sg b{font-size:.78rem;color:var(--m);margin-right:2px}
.mini{background:var(--l);padding:5px 10px;border-radius:8px;font-size:.9rem}.mini.on{background:var(--g)}
.bar{height:22px;background:var(--p2);border-radius:8px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--g)}
.brow{display:flex;gap:10px;align-items:center;margin:6px 0}.brow span{min-width:200px}
.idea{background:var(--p);border-radius:12px;padding:10px;margin-bottom:10px}.idea.st{outline:3px solid var(--gold)}
.idea textarea,.idea input{width:100%;margin-top:6px}
#rem{font-weight:800;color:var(--gold)}
footer{padding:18px 24px;text-align:center;color:var(--m);font-size:.82rem;line-height:1.5}</style></head><body>

const SC=[{"n":"Fala upałów","k":"Kryzys","e":1,"p":"Za tydzień prognozowany jest okres bardzo dużych upałów, w którym temperatura może sięgać 40°C. Takie upały są groźne dla mieszkańców, zwłaszcza dzieci, seniorów i osób chorych.","q":"Jak poprawić komfort i bezpieczeństwo mieszkańców, gdy temperatura będzie sięgać 40°C?","rm":["Wdrożenie w najwyżej tydzień.","Tylko to, co miasto zorganizuje w tydzień: ludzie, istniejący sprzęt, niewielki budżet.","Pomysł dotyczy waszego elementu miasta, a nie miasta ogólnie."],"w":["Da się wdrożyć w tydzień ludźmi, sprzętem i budżetem, które miasto ma pod ręką.","Realnie obniża temperaturę lub ryzyko dla ludzi (cień, woda, odpoczynek, informacja) i wiadomo, kogo chroni.","Dotyczy wylosowanego elementu miasta."],"x":[["Klimatyzacja w każdym mieszkaniu","Skąd pieniądze i prąd i czy zdążycie w tydzień?"],["Zbudujemy nowy park","Co zmieni się w ciągu tygodnia?"]],"el":[["Żłobki, przedszkola, place zabaw","najmłodsi, którzy szybko się przegrzewają"],["Węzły przesiadkowe, przystanki, transport miejski","oczekiwanie na słońcu i nagrzane pojazdy"],["Rynek, deptaki, miejsca turystyczne","tłumy ludzi na rozgrzanym bruku"],["Parki, stawy, miejsca rekreacji","ochłoda i bezpieczeństwo przy wodzie"],["Bloki, podwórka, osiedla","nagrzane mieszkania i podwórka bez cienia"],["Media społecznościowe i przygotowanie mieszkańców","czym i jak informować, jak się przygotować"]]},{"n":"Gwałtowna ulewa","k":"Kryzys","e":0,"p":"Za dwa dni zapowiadane są gwałtowne ulewy. Po nich w mieście mogą być zalane ulice i przejścia, a woda utrudni dotarcie do szkół, przystanków i usług.","q":"Jak ochronić mieszkańców i zapewnić im bezpieczne poruszanie się w czasie i po gwałtownej ulewie?","rm":["Wdrożenie w najwyżej tydzień.","Tylko to, co miasto zorganizuje w tydzień: ludzie, istniejący sprzęt, niewielki budżet.","Pomysł dotyczy waszego elementu miasta, a nie miasta ogólnie."],"w":["Da się wdrożyć w tydzień ludźmi, sprzętem i budżetem, które miasto ma pod ręką.","Realnie chroni ludzi lub mienie przed wodą (trasa, ostrzeżenie, zabezpieczenie) i wiadomo, jak.","Dotyczy wylosowanego elementu miasta."],"x":[["Przebudujemy kanalizację","Co zrobicie jutro rano, gdy woda już stoi?"],["Zbudujemy wały i zbiorniki","Kto je zbuduje w tydzień?"]],"el":[["Domy opieki i przychodnie","osoby, które trudno ewakuować"],["Przejścia podziemne i skrzyżowania","zalane trasy i niebezpieczny ruch"],["Centra handlowe i parkingi podziemne","woda w garażach i tłum w obiektach"],["Rzeki, rowy, zbiorniki","gdzie spływa woda i co ją zatrzymuje"],["Piwnice, garaże, podwórka","zalane mienie i pomoc sąsiedzka"],["Ostrzeganie mieszkańców o ulewie","kto, kiedy i czym ostrzega"]]},{"n":"Awaria zasilania","k":"Kryzys","e":0,"p":"W środę wieczorem w mieście zabraknie prądu na około 24 godziny z powodu awarii sieci. Nie będą działały światła uliczne, sygnalizacja, pompy i część urządzeń.","q":"Jak zapewnić mieszkańcom bezpieczeństwo i podstawowe usługi podczas 24-godzinnej awarii prądu?","rm":["Wdrożenie w najwyżej tydzień.","Tylko to, co miasto zorganizuje w tydzień: ludzie, istniejący sprzęt, niewielki budżet.","Pomysł dotyczy waszego elementu miasta, a nie miasta ogólnie."],"w":["Da się wdrożyć w tydzień ludźmi, sprzętem i budżetem, które miasto ma pod ręką.","Realnie zapewnia bezpieczeństwo lub podstawowe usługi bez prądu przez 24 godziny.","Dotyczy wylosowanego elementu miasta."],"x":[["Każdy dostanie agregat","Skąd agregaty, paliwo i kto je obsłuży?"],["Zbudujemy nową elektrownię","Co działa już jutro wieczorem?"]],"el":[["Osoby zależne od prądu","sprzęt medyczny i opieka w domach"],["Sygnalizacja i transport szynowy","skrzyżowania i tramwaje bez zasilania"],["Sklepy, restauracje, targowiska","żywność, lodówki, płatności"],["Wodociągi i dostęp do wody","pompy bez prądu, woda w kranach"],["Windy, lodówki, ogrzewanie w domach","życie w blokach bez prądu"],["Łączność i informowanie w kryzysie","jak komunikować się bez zasięgu i prądu"]]},{"n":"Śnieżyca i gołole  if(t==0)c=c.filter(i=>SC[i].e);else{const k=SC[S.seq[t-1]].k,c2=c.filter(i=>SC[i].k!=k);if(c2.length)c=c2}

 firms.forEach(f=>f.ord=shuf(f.m.map((_,i)=>i)));

 if(S.st==1)h+=`<div class="card"><p style="font-size:1.15rem;line-height:1.6">Wymyślcie <b>jak najwięcej realnych pomysłów</b> dla swojego elementu miasta. <b>Rzecznik</b> może podchodzić do rzeczników innych firm i pytać: <i>„Czy macie specjalistę, który mógłby nam pomóc?”</i>. Specjalista potwierdza, co faktycznie by zrobił.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button onclick="qrs()">📱 Arkusze na telefon (QR)</button><button onclick="prn()" style="background:#64748b">🖨️ Drukuj arkusze</button></div></div><div class="grid">${S.firms.map((f,i)=>tcard(i)).join("")}</div>`;
 if(S.st==2)h+=`<div class="card"><h3>Wybierzcie 3 najlepsze pomysły</h3><p style="font-size:1.15rem;line-height:1.6;margin-top:6px">Oceniamy tylko trzy pomysły. Przygotujcie dla każdego jedno zdanie: <b>co robimy, jak zdążymy w podanym czasie i czyja wiedza nam pomaga</b>. Prezenter przedstawi je w minutę.</p></div><div class="grid">${S.firms.map((f,i)=>tcard(i)).join("")}</div>`;
 if(S.st==3){h+=`<div class="card"><div class="rub" style="grid-template-columns:repeat(3,1fr)"><div><b>Wymogi (0–3)</b>${D.w.map(x=>`<p><i>+1</i> ${x}</p>`).join("")}</div><div><b>Zawody w firmie (0–2)</b><p><i>+1</i> za każdy zawód z firmy, bez którego pomysł byłby słabszy</p></div><div><b>Pomoc z innej firmy (0–2)</b><p><i>+1</i> za każdego specjalistę, który potwierdził, że tak by pomógł. Firma pomagająca dostaje <i>+1</i> za pomoc.</p></div></div></div>${xs(D)}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(400px,1fr))">${S.firms.map((F,f)=>{const x=sc(t)[f],e=ENM(f,t);return`<div class="fc"><h3>${esc(F.name)} · ${e}</h3><p style="color:var(--m)">🎤 ${nm(f,rol(f,t).p)}</p>${x.i.map((id,i)=>`<div class="idr"><b>Pomysł ${i+1}<br><span style="color:var(--gold)">${ip(id)} pkt</span></b><div>${[0,1,2].map(c=>`<div class="sg"><b>${LB[c]}</b>${Array.from({length:MX[c]+1},(_,v)=>`<button class="mini ${id[c]===v?"on":""}" onclick="setv(${f},${i},${c},${v})">${v}</button>`).join("")}</div>`).join("")}</div></div>`).join("")}<div class="sg" style="margin-top:10px"><b>Pomogliśmy innym</b><button class="mini" onclick="seth(${f},-1)">−</button><b style="font-size:1.1rem;color:var(--t)">${x.h}</b><button class="mini" onclick="seth(${f},1)">+</button></div><p style="margin-top:8px;font-weight:800">Razem: ${ft(t,f)} pkt</p></div>`}).join("")}</div>`}
 if(S.st==4){const c=cov(t),L=left(),more=t<MAXT-1&&L>=NEED+SUM;
 h+=`<div class="card"><h3 style="margin-bottom:8px">Wyniki tury</h3><table><tr><th>Firma</th><th>Element</th><th>Pomysły</th><th>Pomoc innym</th><th>Razem</th></tr>${S.firms.map((F,f)=>`<tr><td>${esc(F.name)}</td><td>${ENM(f,t)}</td><td>${fi(t,f)}</td><td>${sc(t)[f].h}</td><td><b>${ft(t,f)}</b></td></tr>`).join("")}</table><p style="margin-top:10px">Elementy miasta z dobrym planem: <b>${c} z ${K()}</b> · Potwierdzonych pomocy między firmami: <b>${hlp(t)}</b></p></div>
 <div class="card"><h3>Omówienie tury</h3><ul style="padding-left:22px;line-height:1.8"><li>Który pomysł był najbardziej realny i dlaczego?</li><li>Kiedy pomoc specjalisty naprawdę zmieniła pomysł?</li><li>Co utrudniało i co ułatwiało pracę w zespole?</li></ul><p style="margin:10px 0" class="key">${t==MAXT-1?"To była ostatnia tura. Przejdź do podsumowania.":S.t0?`Zostało ok. ${L} min. Kolejna tura potrzebuje ok. ${NEED} min, a podsumowanie ok. ${SUM} min. ${more?"Możesz zacząć kolejną turę.":"Zalecane: przejdź do podsumowania lub dłużej omów tę turę."}`:""}</p></div>`}
 h+=`<div class="nav"><button style="background:#64748b" onclick="go(-1)" ${S.st==0?"disabled":""}>◀ Wstecz</button>${S.st==4?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button style="background:#64748b" onclick="go(2)">Podsumowanie</button>${t<MAXT-1?`<button onclick="go(1)">Następna tura ▶</button>`:""}</div>`:`<button onclick="go(1)" ${S.st==0&&!S.rev[t]?"disabled":""}>Dalej ▶</button>`}</div>`;
 $("#app").innerHTML=h}
function rank(){const r=S.firms.map((f,i)=>({n:esc(f.name),p:tot(i)})).sort((a,b)=>b.p-a.p);return`<table><tr><th>#</th><th>Firma</th><th>Punkty</th></tr>${r.map((x,j)=>`<tr><td>${j+1}</td><td>${j==0?"🏆 ":""}${x.n}</td><td><b>${x.p}</b></td></tr>`).join("")}</table>`}
function final(){const ts=Object.keys(S.done).filter(t=>S.done[t]).map(Number),k=K();
 $("#app").innerHTML=`<h2 class="big">Podsumowanie gry</h2><div class="card"><h3 style="margin-bottom:8px">🏆 Ranking firm</h3>${rank()}</div>
 <div class="card"><h3 style="margin-bottom:6px">Jak nasza współpraca poprawiła miasto (elementy z dobrym planem)</h3><p style="color:var(--m);margin-bottom:8px">Rywalizowaliśmy między sobą, ale we wspólnym celu rozwoju naszego miasta. Scenariusze są różne, więc słupków nie porównujemy ze sobą.</p>${ts.map(t=>`<div class="brow"><span>${SC[S.seq[t]].n}</span><div class="bar"><i style="width:${Math.round(100*cov(t)/k)}%"></i></div><b>${cov(t)} z ${k} elementów</b><small style="color:var(--m)">pomoc: ${hlp(t)}</small></div>`).join("")}</div>
 <div class="nav" style="margin:0 0 14px"><button style="background:#64748b" onclick="backTurn()">◀ Wróć do omówienia tury</button></div><div class="card"><h3>Pytania do rozmowy</h3><ol style="padding-left:22px;line-height:1.8"><li>Jak pracowało się rzecznikom i prezenterom?</li><li>Co było łatwe, a co trudne w pracy zespołu?</li><li>Czy udawało się współpracować z rzecznikami innych firm?</li><li>Który zawód okazał się najbardziej potrzebny i dlaczego?</li><li>Czego dowiedzieliście się o zawodach, których wcześniej nie znaliście?</li></ol></div>`}
function render(){if(!S)return setup();({roster,turn,final})[S.screen]()}
function lnk(f){const t=S.t,r=rol(f,t),F=S.firms[f];return location.origin+location.pathname+"#a="+encodeURIComponent([S.seq[t],el(f,t),cl(F.name),r.n,r.p,...F.m.map(m=>cl(m.n)+"."+m.a+"."+JB[m.a].findIndex(x=>x[0]==m.j))].join("~"))}
function qrs(){const d=$("#dlg");d.style.width="min(1100px,96vw)";
 d.innerHTML=`<h2 style="margin-bottom:6px">📱 Arkusze elektroniczne</h2><p style="color:var(--m);margin-bottom:12px">Jeden telefon na firmę. Arkusz zapisuje się w telefonie i można go pokazać nauczycielowi.</p>${location.protocol=="file:"?'<p class="key">Aplikacja jest otwarta z pliku. Kody zadziałają dopiero po wgraniu strony na GitHub Pages.</p>':""}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${S.firms.map((f,i)=>{let g="";try{const q=qrcode(0,"L");q.addData(lnk(i));q.make();g=q.createSvgTag(4,2)}catch(e){g="<p style='color:#000'>Brak biblioteki QR (sprawdź internet)</p>"}return`<div class="fc" style="text-align:center"><b>${esc(f.name)}</b><div class="qq" style="background:#fff;border-radius:10px;padding:4px;margin:8px 0">${g}</div><small>${ENM(i,S.t)}</small></div>`}).join("")}</div><button style="margin:14px auto 0;display:block" onclick="$('#dlg').close()">Zamknij</button>`;d.showModal()}
function prn(){const t=S.t,D=SC[S.seq[t]];$("#pr").innerHTML=S.firms.map((f,i)=>{const e=ENM(i,t),r=rol(i,t);return`<div class="pg"><h2>Miasto Zawodów · Tura ${t+1}: ${D.n}</h2><p><b>Firma:</b> ${esc(f.name)} &nbsp; <b>Element:</b> ${e} &nbsp; <b>Rzecznik:</b> ${nm(i,r.n)} &nbsp; <b>Prezenter:</b> ${nm(i,r.p)}</p><p><b>Zadanie:</b> ${D.q}</p><p><b>Ramy:</b> ${D.rm.join(" ")}</p><table><tr><td style="width:50%"><b>Pomysł i jak go wdrożyć w podanym czasie</b></td><td><b>Zawody z naszej firmy</b></td><td><b>Specjalista z innej firmy</b></td><td style="width:8%"><b>★ top 3</b></td></tr>${"<tr><td style='height:15mm'></td><td></td><td></td><td></td></tr>".repeat(8)}</table></div>`}).join("");print()}
function sheetMode(){document.querySelector("header").style.display="none";
 const d=decodeURIComponent(location.hash.slice(3)).split("~"),D=SC[+d[0]],e=D&&D.el[+d[1]];
 if(!D||!e){$("#app").innerHTML="<p class='card'>Nieprawidłowy link do arkusza.</p>";return}
 const key="mzs2"+location.hash,fn=esc(d[2]),M=d.slice(5).map(x=>{const[n,a,j]=x.split(".");return{n:esc(n),j:(JB[+a]||[])[+j]?JB[+a][+j][0]:""}});
 let V={ideas:Array.from({length:4},()=>({p:"",z:"",s:"",st:0}))};try{V=JSON.parse(localStorage.getItem(key))||V}catch(x){}
 const sv=()=>{try{localStorage.setItem(key,JSON.stringify(V))}catch(x){}},ns=()=>V.ideas.filter(i=>i.st).length;
 const blk=(i,x)=>`<div class="idea ${x.st?"st":""}" data-i="${i}"><b>Pomysł ${i+1}</b><textarea data-k="p" rows="3" placeholder="Co robimy i jak zdążymy w podanym czasie?">${esc(x.p)}</textarea><input data-k="z" placeholder="Zawody z naszej firmy, które pomagają" value="${esc(x.z)}"><input data-k="s" placeholder="Specjalista z innej firmy (zawód, firma)" value="${esc(x.s)}"><button class="star" style="width:100%;margin-top:8px;background:${x.st?"var(--gold)":"var(--l)"};color:${x.st?"#111":"#fff"}">${x.st?"★ Wybrany do oceny":"☆ Wybieram do oceny"}</button></div>`;
 $("#app").innerHTML=`<div class="sheet"><p style="color:var(--m)">${D.n}</p><h2>${fn}</h2><p>${EM[+d[1]]} <b>${e[0]}</b></p><p>🤝 ${(M[+d[3]]||{}).n} · 🎤 ${(M[+d[4]]||{}).n}</p><div class="card" style="margin-top:10px"><p class="task d">${D.q}</p><ul style="padding-left:20px">${D.rm.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="pgb" id="cn"></div><div id="ideas">${V.ideas.map((x,i)=>blk(i,x)).join("")}</div><button id="add" style="width:100%;margin-bottom:10px;background:#64748b">+ Dodaj pomysł</button><button id="sh" style="width:100%;padding:14px">👀 Pokaż nauczycielowi</button></div>`;
 const cn=()=>$("#cn").textContent=`Wybrane do oceny: ${ns()} z 3`;cn();
 $("#ideas").addEventListener("input",ev=>{const b=ev.target.closest(".idea");V.ideas[+b.dataset.i][ev.target.dataset.k]=ev.target.value;sv()});
 $("#ideas").addEventListener("click",ev=>{if(!ev.target.classList.contains("star"))return;const b=ev.target.closest(".idea"),x=V.ideas[+b.dataset.i];if(!x.st&&ns()>=3){alert("Do oceny wybierzcie tylko 3 pomysły.");return}x.st=x.st?0:1;sv();b.outerHTML=blk(+b.dataset.i,x);cn()});
 $("#add").onclick=()=>{if(V.ideas.length>=10)return;V.ideas.push({p:"",z:"",s:"",st:0});sv();$("#ideas").insertAdjacentHTML("beforeend",blk(V.ideas.length-1,V.ideas[V.ideas.length-1]))};
 $("#sh").onclick=()=>{const o=document.createElement("div");o.className="ov";const s=V.ideas.filter(i=>i.st);o.innerHTML=`<h2>${fn}</h2><p>${EM[+d[1]]} ${e[0]}</p>${s.length?s.map((x,i)=>`<h3>Pomysł ${i+1}</h3><p>${esc(x.p)||"—"}</p><p><b>Zawody w firmie:</b> ${esc(x.z)||"—"}</p><p><b>Specjalista z innej firmy:</b> ${esc(x.s)||"—"}</p>`).join(""):"<p>Nie wybrano jeszcze pomysłów do oceny.</p>"}<button onclick="this.parentNode.remove()">Zamknij</button>`;document.body.append(o)}}
$("#rk").onclick=()=>{if(!S||S.screen=="roster")return;$("#dlg").style.width="";$("#dlg").innerHTML=`<h2 style="margin-bottom:10px">Ranking (podgląd nauczyciela)</h2>${rank()}<button style="margin:14px auto 0;display:block" onclick="$('#dlg').close()">Zamknij</button>`;$("#dlg").showModal()};
$("#nw").onclick=()=>{if(!S||confirm("Zacząć nową grę? Obecny stan zostanie usunięty.")){S=null;try{localStorage.removeItem("mz3")}catch(e){}setup();tickRem()}};
let lf=0,tk=null;const clk=$("#clk"),show=()=>{clk.textContent=String(Math.floor(lf/60)).padStart(2,"0")+":"+String(lf%60).padStart(2,"0")};
$("#ts").onclick=()=>{clearInterval(tk);lf=(parseInt($("#min").value)||5)*60;clk.className="";show();tk=setInterval(()=>{lf--;show();if(lf<=0){clearInterval(tk);clk.textContent="KONIEC";clk.className="end"}},1000)};
$("#tr").onclick=()=>{clearInterval(tk);lf=0;clk.className="";show()};
if(location.hash.startsWith("#a="))sheetMode();else{render();tickRem()}

</script></body></html>
