const tsk=(f,t,c)=>{const a=ST(f,t);return`<p class="task d">${a.z}</p>${c?"":`<ul>${a.w.map(x=>`<li>${x}</li>`).join("")}</ul>`}<p class="key">🔑 Warunek kluczowy: ${a.k}</p>`};
const pts=(t,f)=>((S.sc[t]||[])[f]||[]).reduce((a,b)=>a+(b||0),0);
const std=(t,f)=>{const c=(S.sc[t]||[])[f]||[];return pts(t,f)>=4&&c[2]>=1};
const need=()=>Math.ceil(.75*K()),cnt=t=>S.firms.filter((_,f)=>std(t,f)).length,pass=t=>S.done[t]&&cnt(t)>=need();
const tot=f=>S.T.reduce((a,_,t)=>a+(S.done[t]?pts(t,f):0),0);
function grp(r,k){const a=[...Array(k).keys()];if(k%2)a.push(-1);const m=a.length,rest=a.slice(1),s=r%(m-1),b=[a[0],...rest.slice(s).concat(rest.slice(0,s))],o=[];for(let i=0;i<m/2;i++)o.push([b[i],b[m-1-i]]);const z=o.findIndex(p=>p.includes(-1));if(z>=0){const x=o[z].find(v=>v>=0);if(o.length>1){o.splice(z,1);o[0].push(x)}else o[z]=[x]}return o}
function rot(n,T){const o=shuf([...Array(n).keys()]),r=Array.from({length:T},(_,t)=>({m:o[t%n],c:[]}));for(let j=T;j<n;j++)r[(j-T)%T].c.push(o[j]);return r}
const rz=(f,t)=>{const r=S.firms[f].rot[t];return`🎤 <b>${nm(f,r.m)}</b>`+(r.c.length?` · ➕ ${r.c.map(i=>nm(f,i)).join(", ")} <small style="color:var(--m)">(pytanie 3)</small>`:"")};

function setup(){$("#app").innerHTML=`<div class="card setup"><h2>Nowa gra</h2>
<label>Wariant warsztatów<select id="v"><option value="3h">${V["3h"].txt}</option><option value="2h">${V["2h"].txt}</option></select></label>
<label>Liczba uczniów (6–35)<input id="n" type="number" value="24" min="6" max="35"></label>
<label>Liczba firm (puste = automatycznie, 3–6)<input id="k" type="number" min="3" max="6"></label>
<label>Imiona uczniów (opcjonalnie, po jednym w wierszu)<textarea id="names" rows="4"></textarea></label>
<button onclick="draw()">🎲 Losuj firmy i zawody</button></div>`}
function draw(){let names=$("#names").value.split("\n").map(s=>s.trim()).filter(Boolean);const n=names.length||parseInt($("#n").value);
 if(!n||n<6||n>35){alert("Wpisz liczbę uczniów od 6 do 35.");return}
 if(!names.length)names=Array.from({length:n},(_,i)=>"Uczeń "+(i+1));
 let k=parseInt($("#k").value)||Math.round(n/4.5);k=Math.max(3,Math.min(6,k,Math.floor(n/3)));
 const v=$("#v").value,T=V[v].T,pool=AR.map((_,a)=>shuf(JB[a])),firms=Array.from({length:k},(_,f)=>({name:"Firma "+String.fromCharCode(65+f),m:[]}));
 shuf(names).forEach((s,i)=>{const f=i%k,a=(f+Math.floor(i/k))%5;if(!pool[a].length)pool[a]=shuf(JB[a]);const[j,o]=pool[a].pop();firms[f].m.push({n:s,a,j,o})});
 firms.forEach(f=>f.rot=rot(f.m.length,T.length));
 S={v,T,firms,perm:shuf([0,1,2,3,4]),t:0,st:0,rev:{},sc:{},done:{},screen:"roster"};save();render()}
function roster(){$("#app").innerHTML=`<h2 class="big" style="margin-bottom:12px">Firmy i karty zawodów</h2><div class="grid">${S.firms.map((f,i)=>`<div class="fc"><input class="nm" value="${f.name}" onchange="S.firms[${i}].name=this.value;save()" aria-label="Nazwa firmy">${f.m.map(m=>`<div class="jc" style="--c:${AR[m.a][2]}">${AR[m.a][0]} <b>${m.n}</b> – ${m.j}<small>${m.o}</small></div>`).join("")}</div>`).join("")}</div>
<div class="nav"><button style="background:#64748b" onclick="setup()">🎲 Losuj ponownie</button><button onclick="S.screen='turn';stg();save();render()">Start: tura 1 ▶</button></div>`}
function stg(){const m=V[S.v].min[S.st];if(m)$("#min").value=m}
function go(d){if(S.st==5&&d>0){if(S.t==N()-1)S.screen="final";else{S.t++;S.st=0}}else S.st+=d;if(S.st==5)S.done[S.t]=true;else S.done[S.t]=false;stg();save();render();scrollTo(0,0)}
function sc(f,c,v){(S.sc[S.t]=S.sc[S.t]||[])[f]=S.sc[S.t][f]||[null,null,null];S.sc[S.t][f][c]=v;save();render()}
const okSc=()=>S.firms.every((_,f)=>((S.sc[S.t]||[])[f]||[]).filter(v=>v!=null).length==3);
function city(){return`<div class="city">${S.T.map((_,t)=>S.done[t]?(pass(t)?"🏙️":"🏗️"):"⬜").join("")}<small>Miasto: ${S.T.filter((_,t)=>pass(t)).length} z ${N()}</small></div>`}
function turn(){const t=S.t,ti=S.T[t],D=TR[ti];
 let h=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px"><h2 class="big">Tura ${t+1}/${N()}: ${D.n}</h2>${city()}</div><div class="steps">${STG.map((s,i)=>`<div class="${i==S.st?"on":""}">${s}</div>`).join("")}</div>`;
 if(S.st==0){h+=`<div class="hero">${scene(ti)}<div class="tx"><p>${D.p}</p><p style="color:var(--gold);margin-top:8px"><b>Rezultat:</b> ${D.r}</p></div></div>
 <div class="card"><h3 style="margin-bottom:8px">Jak oceniamy waszą pracę (0–2 pkt za każde)</h3><div class="rub">${CR.map(c=>`<div><b>${c[0]}</b>${c[1].map((x,i)=>`<p><i>${i}</i> ${x}</p>`).join("")}</div>`).join("")}</div></div>
 <div class="card"><h3>Rzecznicy tej tury <small style="color:var(--m);font-weight:500">(rzecznik jest też liderem zespołu)</small></h3>${S.rev[t]?`<div class="grid" style="margin-top:10px">${S.firms.map((f,i)=>`<div class="fc" style="animation-delay:${i*.15}s"><b>${f.name}</b><p style="margin-top:6px">${rz(i,t)}</p></div>`).join("")}</div>`:`<button style="margin-top:10px" onclick="S.rev[S.t]=true;save();render()">🎲 Losuj rzeczników</button>`}</div>`}
 if(S.st==1)h+=`<div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:10px"><p style="color:var(--m)">Każdy ma wkład: pomysł, pytanie, szkic lub uwagę. Korzystajcie z perspektyw z kart zawodów.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="qrs()" style="white-space:nowrap">📱 Arkusze na telefon (QR)</button><button onclick="prn()" style="background:#64748b;white-space:nowrap">🖨️ Drukuj</button></div></div><div class="grid">${S.firms.map((f,i)=>`<div class="fc"><h3>${f.name}</h3>${tsk(i,t)}<p style="margin-top:8px">${rz(i,t)}</p></div>`).join("")}</div>`;
 if(S.st==2){const G=grp(t,K());h+=`<p style="margin-bottom:10px;color:var(--m)">Rzecznik przedstawia roboczy pomysł innej firmie i prosi o konkretną wskazówkę. Reszta zespołu przygotowuje pytania. To nie konkurs.</p><div class="grid">${G.map(g=>`<div class="fc"><h3>${g.map(f=>S.firms[f].name).join(" ⇄ ")}</h3>${g.length==3?g.map((f,j)=>`<p style="margin-top:6px">${S.firms[f].name} przedstawia → <b>${S.firms[g[(j+1)%3]].name}</b></p>`).join(""):""}${g.map(f=>`<p style="margin-top:6px">${rz(f,t)}</p>`).join("")}</div>`).join("")}</div>`}
 if(S.st==3)h+=`<div class="card"><h3>Rzecznik (20–25 s) odpowiada na trzy pytania:</h3><ol style="padding-left:24px;line-height:2;font-size:1.2rem"><li>Jaki problem rozwiązujemy?</li><li>Na czym polega nasze rozwiązanie?</li><li>Co zmieniliśmy lub przemyśleliśmy po konsultacji?</li></ol></div><div class="grid">${S.firms.map((f,i)=>`<div class="fc"><h3>${f.name}</h3>${tsk(i,t,1)}<p style="margin-top:8px">${rz(i,t)}</p></div>`).join("")}</div>`;
 if(S.st==4){h+=`<div class="card"><div class="rub">${CR.map(c=>`<div><b>${c[0]}</b>${c[1].map((x,i)=>`<p><i>${i}</i> ${x}</p>`).join("")}</div>`).join("")}</div></div><div class="card sc"><div></div>${CR.map((c,i)=>`<div class="h">${i+1}. ${c[0].split(" ")[0]}</div>`).join("")}${S.firms.map((f,i)=>{const r=(S.sc[t]||[])[i]||[];return`<div><b>${f.name}</b><small style="display:block;color:var(--m)">🔑 ${ST(i,t).k}</small></div>${[0,1,2].map(c=>`<div>${[0,1,2].map(v=>`<button class="pt ${r[c]===v?"on":""}" onclick="sc(${i},${c},${v})">${v}</button>`).join(" ")}</div>`).join("")}`}).join("")}</div>`}
 if(S.st==5){const c=cnt(t),ok=pass(t);h+=`<div class="hero"><div class="tx" style="text-align:center;font-size:1.3rem"><div style="font-size:4rem">${ok?"🏙️":"🏗️"}</div><h2>${ok?"Wyzwanie zaliczone!":"Miasto pracuje dalej"}</h2><p>${c} z ${K()} firm spełniło standard (potrzeba ${need()}).</p><p style="color:var(--m);font-size:1rem">Standard: co najmniej 4 z 6 pkt i konkretna konsultacja.</p></div></div>`}
 h+=`<div class="nav"><button style="background:#64748b" onclick="go(-1)" ${S.st==0||S.st==5?"disabled":""}>◀ Wstecz</button><button onclick="go(1)" ${(S.st==0&&!S.rev[t])||(S.st==4&&!okSc())?"disabled":""}>${S.st==5?(t==N()-1?"Podsumowanie ▶":"Następna tura ▶"):"Dalej ▶"}</button></div>`;
 $("#app").innerHTML=h}
function prn(){const t=S.t,D=TR[S.T[t]],L=n=>'<div class="ln"></div>'.repeat(n);
 $("#pr").innerHTML=S.firms.map((f,i)=>{const a=ST(i,t),r=f.rot[t];return`<div class="pg"><h2>Miasto Zawodów · Tura ${t+1}: ${D.n}</h2><p><b>Firma:</b> ${f.name} &nbsp;&nbsp; <b>Rzecznik:</b> ${f.m[r.m].n}${r.c.length?" + "+r.c.map(c=>f.m[c].n).join(", "):""}</p><p><b>Zadanie:</b> ${a.z}</p><p><b>Wymagania:</b> ${a.w.join("; ")}.</p><p class="key">🔑 Warunek kluczowy: ${a.k}</p><p><b>Rezultat:</b> ${D.r}</p>
<h4>1. Nasz pomysł (wersja 1)</h4>${L(3)}<h4>2. Wkład zawodów w rozwiązanie</h4><table>${f.m.map(m=>`<tr><td style="width:40%">${m.n} – ${m.j}</td><td></td></tr>`).join("")}</table><h4>3. Szkic</h4><div class="bx"></div><h4>4. Konsultacja z firmą: ……………………</h4><p>Wskazówka, którą dostaliśmy:</p>${L(1)}<p>Nasza rekomendacja dla nich:</p>${L(1)}<h4>5. Co zmieniliśmy po konsultacji (albo dlaczego odrzuciliśmy wskazówkę)</h4>${L(2)}<h4>6. Przewidywany efekt (kto, gdzie, co się zmieni)</h4>${L(1)}</div>`}).join("");print()}
function rank(){const r=S.firms.map((f,i)=>({n:f.name,p:tot(i)})).sort((a,b)=>b.p-a.p);return`<table><tr><th>#</th><th>Firma</th><th>Punkty</th></tr>${r.map((x,j)=>`<tr><td>${j+1}</td><td>${j==0?"🏆 ":""}${x.n}</td><td><b>${x.p}</b></td></tr>`).join("")}</table>`}
function final(){const w=S.T.filter((_,t)=>pass(t)).length;
 $("#app").innerHTML=`<h2 class="big">Podsumowanie gry</h2><div class="card" style="text-align:center"><div class="city" style="justify-content:center;font-size:3rem">${S.T.map((_,t)=>pass(t)?"🏙️":"🏗️").join("")}</div><h2 style="margin-top:8px">Miasto Przyszłości: ${w} z ${N()} wyzwań zaliczonych</h2></div>
 <div class="card"><h3 style="margin-bottom:8px">🏆 Firma Roku</h3>${rank()}</div>
 <div class="card"><h3>Pytania do rozmowy</h3><ol style="padding-left:22px;line-height:1.8"><li>Które zadanie było najtrudniejsze i dlaczego?</li><li>Co wnieśli do projektu przedstawiciele różnych zawodów?</li><li>Czy wskazówka od innej firmy zmieniła wasz pomysł?</li><li>Jak rozwiązaliście różnice zdań?</li><li>Co pomagało wam współpracować, a co utrudniało?</li><li>Która kompetencja była najważniejsza w waszym zespole?</li><li>Czego dowiedzieliście się o zawodach, których wcześniej nie znaliście?</li></ol></div>`}
function render(){if(!S)return setup();({roster,turn,final})[S.screen]()}
$("#rk").onclick=()=>{if(!S||S.screen=="roster")return;$("#dlg").style.width="";$("#dlg").innerHTML=`<h2 style="margin-bottom:10px">Ranking (podgląd nauczyciela)</h2>${rank()}<button style="margin:14px auto 0;display:block" onclick="$('#dlg').close()">Zamknij</button>`;$("#dlg").showModal()};
$("#nw").onclick=()=>{if(!S||confirm("Zacząć nową grę? Obecny stan zostanie usunięty.")){S=null;try{localStorage.removeItem("mz1")}catch(e){}setup()}};
let left=0,tk=null;const clk=$("#clk"),show=()=>{clk.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")};
$("#ts").onclick=()=>{clearInterval(tk);left=(parseInt($("#min").value)||5)*60;clk.className="";show();tk=setInterval(()=>{left--;show();if(left<=0){clearInterval(tk);clk.textContent="KONIEC";clk.className="end"}},1000)};
$("#tr").onclick=()=>{clearInterval(tk);left=0;clk.className="";show()};
const cl=x=>String(x).replace(/[~.]/g,""),esc=x=>String(x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function lnk(f){const t=S.t,F=S.firms[f],r=F.rot[t];return location.origin+location.pathname+"#a="+encodeURIComponent([S.T[t],sub(f,t),cl(F.name),[r.m,...r.c].join("."),...F.m.map(m=>cl(m.n)+"."+m.a+"."+JB[m.a].findIndex(x=>x[0]==m.j))].join("~"))}
function qrs(){const d=$("#dlg");d.style.width="min(1100px,96vw)";
 d.innerHTML=`<h2 style="margin-bottom:6px">📱 Arkusze elektroniczne</h2><p style="color:var(--m);margin-bottom:12px">Rzecznik skanuje kod swojej firmy telefonem. Arkusz zapisuje się w jego telefonie i można go pokazać nauczycielowi.</p>${location.protocol=="file:"?'<p class="key">Aplikacja jest otwarta z pliku na komputerze. Kody zadziałają dopiero po wgraniu strony na GitHub Pages.</p>':""}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${S.firms.map((f,i)=>{let g="";try{const q=qrcode(0,"L");q.addData(lnk(i));q.make();g=q.createSvgTag(4,2)}catch(e){g="<p style='color:#000'>Brak biblioteki QR (sprawdź internet)</p>"}return`<div class="fc" style="text-align:center"><b>${f.name}</b><div class="qq" style="background:#fff;border-radius:10px;padding:4px;margin:8px 0">${g}</div><small>🎤 ${esc(f.m[f.rot[S.t].m].n)}</small></div>`}).join("")}</div><button style="margin:14px auto 0;display:block" onclick="$('#dlg').close()">Zamknij</button>`;d.showModal()}
function sheetMode(){document.querySelector("header").style.display="none";
 const d=decodeURIComponent(location.hash.slice(3)).split("~"),D=TR[+d[0]],a=D&&D.s[+d[1]];
 if(!a){$("#app").innerHTML="<p class='card'>Nieprawidłowy link do arkusza.</p>";return}
 const w=a[1].split(";"),rs=d[3].split(".").map(Number),M=d.slice(4).map(x=>{const[n,ar,j]=x.split(".");return{n:esc(n),j:JB[+ar][+j][0]}}),key="mzs"+location.hash,fn=esc(d[2]);
 let V={};try{V=JSON.parse(localStorage.getItem(key))||{}}catch(e){}
 const T=(id,l,r)=>`<label class="sl">${l}<textarea data-k="${id}" rows="${r||3}">${esc(V[id]||"")}</textarea></label>`;
 $("#app").innerHTML=`<div class="sheet"><p style="color:var(--m)">${D.n}</p><h2>${fn}</h2><p>🎤 ${rs.map(i=>M[i].n).join(", ")}</p><div class="card" style="margin-top:10px"><p class="task d">${a[0]}</p><ul style="padding-left:20px">${w.map(x=>`<li>${x}</li>`).join("")}</ul><p class="key">🔑 Warunek kluczowy: ${a[2]}</p><p style="margin-top:8px;color:var(--m)">Rezultat: ${D.r}</p></div><div id="pgb" class="pgb"></div>
 ${T("i","1. Nasz pomysł (wersja 1)",4)}<div class="sl">2. Wkład zawodów</div>${M.map((m,i)=>T("w"+i,`${m.n} – ${m.j}`,2)).join("")}<p style="color:var(--m);margin-bottom:12px">✏️ Szkic zróbcie na kartce.</p>${T("kf","3. Konsultacja: z którą firmą?",1)}${T("kw","Wskazówka, którą dostaliśmy")}${T("kr","Nasza rekomendacja dla nich")}${T("z","4. Co zmieniliśmy po konsultacji (albo dlaczego odrzuciliśmy wskazówkę)")}${T("e","5. Przewidywany efekt (kto, gdzie, co się zmieni)")}<button id="sh" style="width:100%;padding:14px">👀 Pokaż nauczycielowi</button></div>`;
 const pr=()=>{const c=[V.i,M.some((_,i)=>V["w"+i]),V.kf&&V.kw&&V.kr,V.z,V.e].filter(x=>x&&String(x).trim()).length;$("#pgb").textContent=`Wypełniono ${c} z 5 części`};pr();
 document.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{V[t.dataset.k]=t.value;try{localStorage.setItem(key,JSON.stringify(V))}catch(e){}pr()});
 $("#sh").onclick=()=>{const g=k=>esc(V[k]||"—"),o=document.createElement("div");o.className="ov";
  o.innerHTML=`<h2>${fn}</h2><p>${a[0]}</p><h3>Pomysł</h3><p>${g("i")}</p><h3>Wkład zawodów</h3>${M.map((m,i)=>`<p><b>${m.n}</b> (${m.j}): ${g("w"+i)}</p>`).join("")}<h3>Konsultacja</h3><p>Firma: ${g("kf")}</p><p>Wskazówka: ${g("kw")}</p><p>Nasza rekomendacja: ${g("kr")}</p><h3>Co zmieniliśmy</h3><p>${g("z")}</p><h3>Przewidywany efekt</h3><p>${g("e")}</p><button onclick="this.parentNode.remove()">Zamknij</button>`;document.body.append(o)}}

if(location.hash.startsWith("#a="))sheetMode();else render();
</script></body></html>
